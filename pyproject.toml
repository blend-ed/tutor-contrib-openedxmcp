[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-contrib-openedxmcp"
version = "0.1.7"
description = "Tutor plugin: MCP server + openedx-mcp Django app for staff/superuser admin (Ulmo)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [{ name = "Open edX MCP contributors" }]
dependencies = ["tutor>=19.0.0,<22.0.0"]

[project.entry-points."tutor.plugin.v1"]
openedxmcp = "tutoropenedxmcp.plugin"

[tool.setuptools]
packages = ["tutoropenedxmcp"]
include-package-data = true

# Belt-and-suspenders: MANIFEST.in (recursive-include) is the reliable source for
# the nested templates/ tree in both sdist and wheel; the globs below are a fallback.
[tool.setuptools.package-data]
tutoropenedxmcp = ["templates/**/*", "templates/**/.*", "patches/*"]
